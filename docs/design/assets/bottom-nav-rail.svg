  <circle cx="736" cy="168" r="9" fill="#3D4EDB"/><text x="756" y="173" font-size="13" font-weight="500" fill="#3D4EDB">Home</text>
  <circle cx="736" cy="222" r="9" fill="none" stroke="#535D6B" stroke-width="2"/><text x="756" y="227" font-size="13" fill="#535D6B">Trips</text>
  <circle cx="736" cy="270" r="9" fill="none" stroke="#535D6B" stroke-width="2"/><text x="756" y="275" font-size="13" fill="#535D6B">Live Map</text>
  <circle cx="736" cy="318" r="9" fill="none" stroke="#535D6B" stroke-width="2"/><text x="756" y="323" font-size="13" fill="#535D6B">Payments</text>
  <line x1="714" y1="350" x2="906" y2="350" stroke="#D8DAE0"/>
  <circle cx="736" cy="382" r="9" fill="none" stroke="#535D6B" stroke-width="2"/><text x="756" y="387" font-size="13" fill="#535D6B">Vehicles</text>
  <circle cx="736" cy="426" r="9" fill="none" stroke="#535D6B" stroke-width="2"/><text x="756" y="431" font-size="13" fill="#535D6B">Reports</text>
  <text x="700" y="528" font-size="11" fill="#535D6B">Expanded inlines More-sheet items. Never a bottom bar here.</text>

  <!-- notes -->
  <text x="40" y="556" font-size="13" font-weight="600" fill="#16181D">Build notes</text>
  <text x="40" y="578" font-size="12" fill="#535D6B">• Chrome swap (bar↔rail) reads WINDOW size class (currentWindowAdaptiveInfo / root BoxWithConstraints) — NEVER container rememberFleetBreakpoint.</text>
  <text x="40" y="598" font-size="12" fill="#535D6B">• Selected: filled icon + primary label + slot pill (primaryContainer). Inactive: outline icon + onSurfaceVariant. Persistent active highlight (fixes drawer selected=false).</text>
  <text x="40" y="618" font-size="12" fill="#535D6B">• Permission gating (INTERIM): visible if user holds ANY perm in domain; Live Map + Payments visible to all authed. Bar backfills top-4 from visible set — no gaps/shift.</text>
  <text x="40" y="638" font-size="12" fill="#535D6B">• Motion: outline→filled crossfade ~180ms; slot pill FastSpring; page Standard ~220ms; no bounce. Touch target ≥44dp/item.</text>
  <text x="40" y="658" font-size="12" fill="#535D6B">• Widest Hindi backfill labels (वाहन वित्त, ग्राहक) must wrap to 2 lines without clip in any slot.</text>
</svg>
