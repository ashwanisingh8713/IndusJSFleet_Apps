  <rect x="40" y="264" width="420" height="100" rx="0" fill="#F2F2F0"/>
  <line x1="40" y1="264" x2="460" y2="264" stroke="#D8DAE0"/>
  <rect x="58" y="278" width="64" height="32" rx="16" fill="#E1E4FF"/>
  <circle cx="90" cy="294" r="9" fill="#3D4EDB"/>
  <text x="90" y="332" font-size="11" font-weight="500" fill="#3D4EDB" text-anchor="middle">होम</text>
  <circle cx="174" cy="294" r="9" fill="none" stroke="#535D6B" stroke-width="2"/>
  <text x="174" y="332" font-size="11" font-weight="500" fill="#535D6B" text-anchor="middle">यात्राएँ</text>
  <circle cx="258" cy="294" r="9" fill="none" stroke="#535D6B" stroke-width="2"/>
  <text x="258" y="332" font-size="11" font-weight="500" fill="#535D6B" text-anchor="middle">लाइव</text>
  <text x="258" y="346" font-size="11" font-weight="500" fill="#535D6B" text-anchor="middle">मैप</text>
  <circle cx="342" cy="294" r="9" fill="none" stroke="#535D6B" stroke-width="2"/>
  <text x="342" y="332" font-size="11" font-weight="500" fill="#535D6B" text-anchor="middle">भुगतान</text>
  <circle cx="426" cy="294" r="9" fill="none" stroke="#535D6B" stroke-width="2"/>
  <text x="426" y="332" font-size="11" font-weight="500" fill="#535D6B" text-anchor="middle">और</text>

  <!-- DARK bottom bar -->
  <text x="40" y="402" font-size="15" font-weight="600" fill="#16181D">Compact bottom bar — Dark (selected icon = onPrimaryContainer #E1E4FF, NOT primary)</text>
  <rect x="40" y="414" width="420" height="86" rx="0" fill="#191D24"/>
  <line x1="40" y1="414" x2="460" y2="414" stroke="#2A303A"/>
  <rect x="58" y="428" width="64" height="32" rx="16" fill="#2C36A6"/>
  <circle cx="90" cy="444" r="9" fill="#E1E4FF"/>
  <text x="90" y="482" font-size="11" font-weight="500" fill="#9AA6FF" text-anchor="middle">Home</text>
  <circle cx="174" cy="444" r="9" fill="none" stroke="#A6AFBC" stroke-width="2"/>
  <text x="174" y="482" font-size="11" font-weight="500" fill="#A6AFBC" text-anchor="middle">Trips</text>
  <circle cx="258" cy="444" r="9" fill="none" stroke="#A6AFBC" stroke-width="2"/>
  <text x="258" y="482" font-size="11" font-weight="500" fill="#A6AFBC" text-anchor="middle">Live Map</text>
  <circle cx="342" cy="444" r="9" fill="none" stroke="#A6AFBC" stroke-width="2"/>
  <text x="342" y="482" font-size="11" font-weight="500" fill="#A6AFBC" text-anchor="middle">Payments</text>
  <circle cx="426" cy="444" r="9" fill="none" stroke="#A6AFBC" stroke-width="2"/>
  <text x="426" y="482" font-size="11" font-weight="500" fill="#A6AFBC" text-anchor="middle">More</text>

  <!-- Compact rail (Medium) -->
  <text x="560" y="116" font-size="15" font-weight="600" fill="#16181D">Compact rail — Medium (~80dp)</text>
  <rect x="560" y="128" width="92" height="372" fill="#F2F2F0"/>
  <line x1="652" y1="128" x2="652" y2="500" stroke="#D8DAE0"/>
  <rect x="576" y="146" width="60" height="44" rx="14" fill="#E1E4FF"/>
  <circle cx="606" cy="164" r="9" fill="#3D4EDB"/><text x="606" y="186" font-size="10" font-weight="500" fill="#3D4EDB" text-anchor="middle">Home</text>
  <circle cx="606" cy="226" r="9" fill="none" stroke="#535D6B" stroke-width="2"/><text x="606" y="248" font-size="10" fill="#535D6B" text-anchor="middle">Trips</text>
  <circle cx="606" cy="288" r="9" fill="none" stroke="#535D6B" stroke-width="2"/><text x="606" y="310" font-size="10" fill="#535D6B" text-anchor="middle">Map</text>
