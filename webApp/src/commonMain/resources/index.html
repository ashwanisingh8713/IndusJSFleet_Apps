<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
        <link rel="manifest" href="./manifest.json">
        <title>IndusJSFleet</title>
        <style>
            html,
            body {
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                overflow: hidden;
            }
        </style>
    </head>
    <body style="text-align: center; align-content: center">
    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 50 50" role="presentation">
        <circle cx="25" cy="25" r="20" stroke="#ccc" stroke-width="4" fill="none"/>
        <circle cx="25" cy="25" r="20" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="90 125">
            <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s" repeatCount="indefinite"/>
        </circle>
    </svg>
    </body>
    <!-- Razorpay Standard Checkout (JS + Wasm bridge). Must load before webApp.js -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
        (function () {
            function done(onDone, obj) {
                try {
                    onDone(JSON.stringify(obj));
                } catch (e) {
                    console.error(e);
                }
            }
            var bridge = {
                open: function (payloadJson, onDone) {
                    var finished = false;
                    function finish(obj) {
                        if (finished) return;
                        finished = true;
                        done(onDone, obj);
                    }
                    if (typeof Razorpay === "undefined") {
                        finish({
                            type: "failed",
                            code: 0,
                            description: "Razorpay checkout.js failed to load."
                        });
                        return;
                    }
                    var options;
                    try {
                        options = JSON.parse(payloadJson);
                    } catch (e) {
                        finish({ type: "failed", code: 0, description: "Invalid checkout JSON" });
                        return;
                    }
                    options.handler = function (response) {
                        finish({
                            type: "success",
                            razorpay_order_id: response.razorpay_order_id,
                            razorpay_payment_id: response.razorpay_payment_id,
                            razorpay_signature: response.razorpay_signature
                        });
                    };
                    options.modal = {
                        ondismiss: function () {
                            finish({ type: "dismiss" });
                        }
                    };
                    var rzp = new Razorpay(options);
                    rzp.on("payment.failed", function (resp) {
                        var err = (resp && resp.error) || {};
                        var raw = err.code;
                        var code =
                            typeof raw === "number" && !isNaN(raw)
                                ? raw | 0
                                : (function (x) {
                                      var p = parseInt(String(x), 10);
                                      return isNaN(p) ? 0 : p;
                                  })(raw);
                        finish({
                            type: "failed",
                            code: code,
                            description: err.description || "Payment failed"
                        });
                    });
                    rzp.open();
                }
            };
            if (typeof globalThis !== "undefined") globalThis.__IndusFleetRazorpay = bridge;
            if (typeof window !== "undefined") window.__IndusFleetRazorpay = bridge;
        })();
    </script>
    <script src="webApp.js"></script>
</html>
